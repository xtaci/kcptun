name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet -mod=vendor ./...
      - run: go test -mod=vendor ./...
      - run: go build -mod=vendor ./client ./server
      - name: Race test
        if: runner.os == 'Linux'
        run: go test -mod=vendor -race ./...

  cross-build:
    name: Cross-build release targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build client and server
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=0
          export GOMIPS=softfloat
          for target in darwin/amd64 darwin/arm64 freebsd/amd64 \
            linux/386 linux/amd64 linux/arm64 linux/loong64 \
            linux/mips linux/mipsle windows/386 windows/amd64 windows/arm64; do
            echo "Building $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -mod=vendor ./client ./server
          done
          for arm in 5 6 7; do
            echo "Building linux/arm$arm"
            GOOS=linux GOARCH=arm GOARM="$arm" go build -mod=vendor ./client ./server
          done
